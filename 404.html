<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Masum Mz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #020703;
      background-image: radial-gradient(circle at center, rgba(0, 255, 136, 0.08), transparent 70%);
      color: #fff;
      padding: 2rem 1.5rem;
      font-family: 'Poppins', sans-serif;
    }
    .error-container {
      max-width: 550px;
      background: rgba(6, 18, 8, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 24px;
      padding: 3.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(0, 255, 136, 0.15);
      backdrop-filter: blur(15px);
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #00ff88, #6ef028);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
    }
    .error-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: #b3c2b6;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Lost in the Timeline</h1>
    <p class="error-desc">The cut or scene you are looking for doesn't exist or was moved to another track. Let's get you back on story!</p>
    <div class="error-actions">
      <a href="index.html" class="primary-btn"><i class="fa-solid fa-house"></i> Return Home</a>
      <a href="index.html#portfolio" class="secondary-btn"><i class="fa-solid fa-play"></i> Watch Portfolio</a>
    </div>
  </div>
</body>
</html>
